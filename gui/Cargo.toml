[package]
name = "ctp-cosmic-gui"
version = "0.9.0"
edition = "2024"
license = "MIT"
description = "Preview Catppuccin themes and wallpapers and apply them to COSMIC"
repository = "https://github.com/Lucas-BRT/catppuccin-cosmic-setup"
publish = false

[dependencies]
ctp-cosmic = { path = ".." }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.8.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }

[build-dependencies]
xdgen = "0.1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# The commit cosmic-settings 1.11 (build 6aaf30d) is built with, which is also
# the one the tests of the root crate parse themes with.
rev = "dd108aa99d7306110eef06da43eafc109e1ab151"
default-features = false
features = ["about", "single-instance", "wgpu", "xdg-portal", "winit", "tokio", "wayland", "dbus-config", "a11y", "multi-window"]
