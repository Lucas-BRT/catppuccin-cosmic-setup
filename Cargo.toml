[workspace]
members = [".", "gui"]
# The graphical app pulls in libcosmic; plain cargo commands skip it.
default-members = ["."]
resolver = "3"

[package]
name = "ctp-cosmic"
version = "0.9.0"
edition = "2024"
description = "Catppuccin for COSMIC: palette, desktop themes and procedural wallpapers"
license = "MIT"
repository = "https://github.com/Lucas-BRT/catppuccin-cosmic-setup"
publish = false

[[bin]]
name = "ctp-cosmic"
path = "src/main.rs"

[dependencies]
adler2 = "2"
crc32fast = "1"
flate2 = "1"
catppuccin = "2.8.0"
jsonc-parser = { version = "0.34", features = ["cst"] }
png = "0.18.1"
ratatui = "0.30.2"
rayon = "1.12.0"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"

[dev-dependencies]
# Only for tests: the generated themes are parsed with COSMIC's own
# ThemeBuilder, at the libcosmic commit of cosmic-settings 1.11 (build
# 6aaf30d, with font, mono_font and icon_theme in the theme) and of 1.10.
cosmic-theme = { git = "https://github.com/pop-os/libcosmic", rev = "dd108aa99d7306110eef06da43eafc109e1ab151", default-features = false }
cosmic-theme-110 = { package = "cosmic-theme", git = "https://github.com/pop-os/libcosmic", rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
