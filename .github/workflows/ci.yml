name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ctp-cosmic:
    name: ctp-cosmic (Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ctp-cosmic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Test (themes are parsed with COSMIC's own ThemeBuilder)
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Committed themes are up to date
        run: |
          target/release/ctp-cosmic theme --all "$RUNNER_TEMP/themes"
          for f in ../themes/cosmic-settings/*.ron; do
            cmp "$f" "$RUNNER_TEMP/themes/$(basename "$f")" || {
              echo "::error::$f is stale; run: ctp-cosmic theme --all and copy the Mocha files"
              exit 1
            }
          done

  scripts:
    name: Installer scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck -x get.sh install.sh uninstall.sh scripts/*.sh scripts/dev/*.sh
      - name: Pinned release is complete
        run: |
          if [ -f ctp-cosmic/RELEASE ]; then
            for arch in x86_64 aarch64; do
              grep -q " ctp-cosmic-$arch-linux\$" ctp-cosmic/SHA256SUMS
            done
          fi
