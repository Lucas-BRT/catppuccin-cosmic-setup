name: Release

# To release:
#   bump the version in Cargo.toml, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
# This builds static ctp-cosmic binaries and the ctp-cosmic-gui app (x86_64,
# aarch64; the app needs libxkbcommon at run time) and publishes them with
# the app's launcher entry and icon, install.sh and a SHA256SUMS file as the latest release, which is what
#   curl -fsSL .../releases/latest/download/install.sh | bash
# installs and what `ctp-cosmic update` downloads. The binaries carry a signed
# provenance attestation; check one with
#   gh attestation verify FILE --repo Lucas-BRT/catppuccin-cosmic-setup

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { arch: aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --release --locked
      - name: Build static binary
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          cargo build --release --locked --target "$TARGET"
          mkdir dist
          cp "target/$TARGET/release/ctp-cosmic" "dist/ctp-cosmic-$ARCH-linux"
      - name: Smoke test
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ github.ref_name }}
        run: |
          bin="dist/ctp-cosmic-$ARCH-linux"
          file "$bin"
          test "$("$bin" --version)" = "ctp-cosmic ${TAG#v}"
          "$bin" wallpaper --all "$RUNNER_TEMP/out" --flavor latte --accent teal
          test "$(ls "$RUNNER_TEMP/out" | wc -l)" -eq "$("$bin" wallpaper --list-styles | wc -l)"
          "$bin" theme --all "$RUNNER_TEMP/themes"
          "$bin" palette check latte teal
          "$bin" apply --list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/

  build-gui:
    name: Build the app ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Test
        run: cargo test --release --locked -p ctp-cosmic-gui
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cargo build --release --locked -p ctp-cosmic-gui
          mkdir dist
          cp target/release/ctp-cosmic-gui "dist/ctp-cosmic-gui-$ARCH-linux"
          # The launcher entry and icon are the same for every machine.
          if [ "$ARCH" = x86_64 ]; then
            cp gui/target/xdgen/app.desktop dist/io.github.Lucas_BRT.CtpCosmic.desktop
            cp gui/resources/icons/hicolor/scalable/apps/icon.svg dist/io.github.Lucas_BRT.CtpCosmic.svg
          fi
      - name: Smoke test
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bin="dist/ctp-cosmic-gui-$ARCH-linux"
          file "$bin"
          # Only system libraries it needs at run time may be missing on a desktop.
          ldd "$bin"
          ! ldd "$bin" | grep "not found"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gui-${{ matrix.arch }}
          path: dist/

  release:
    name: Publish release
    needs: [build, build-gui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write       # sign the provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ctp-cosmic-*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cp install.sh dist/
          cd dist
          sha256sum ctp-cosmic-* io.github.* install.sh > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --latest --generate-notes \
            --notes "Install with:

          \`\`\`bash
          curl -fsSL https://github.com/$REPO/releases/latest/download/install.sh | bash
          \`\`\`" \
            ctp-cosmic-* io.github.* install.sh SHA256SUMS
